<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ветпаспорт — база домашних питомцев" />
    <title>Ветпаспорт</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/theme.js"></script>
    <script defer src="js/data.js"></script>
    <script defer src="js/dom.js"></script>
    <script defer src="js/router.js"></script>
    <script defer src="js/views.js"></script>
    <script defer src="js/main.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="header__inner container">
        <a href="#/" class="logo">Ветпаспорт</a>
        <button
          class="burger"
          type="button"
          aria-controls="site-nav"
          aria-expanded="false"
          aria-label="Открыть меню"
        >
          <span class="burger__line"></span>
        </button>
        <nav class="nav" id="site-nav" aria-label="Основное меню"></nav>
        <button
          class="theme-toggle"
          type="button"
          aria-label="Тёмная тема"
        ></button>
      </div>
    </header>
    <main class="container">
      <nav class="breadcrumbs" aria-label="Хлебные крошки"></nav>
      <section class="page" id="app" tabindex="-1"></section>
    </main>
    <footer class="footer">
      <div class="container footer__inner">
        <span>© 2026 Ветпаспорт</span>
        <span>Создатель сайта — Иутинский Дмитрий</span>
      </div>
    </footer>
  </body>
</html>
