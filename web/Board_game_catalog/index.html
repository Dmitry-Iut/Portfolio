<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Фишка — издательство настольных игр. Каталог игр для семьи и компании."
    />
    <meta name="theme-color" content="#b8102b" />
    <title>Фишка</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/theme.js"></script>
    <script defer src="js/data.js"></script>
    <script defer src="js/dom.js"></script>
    <script defer src="js/router.js"></script>
    <script defer src="js/store.js"></script>
    <script defer src="js/components.js"></script>
    <script defer src="js/views.js"></script>
    <script defer src="js/main.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="header__inner container">
        <a href="#/" class="logo">
          <span class="logo__mark" aria-hidden="true">Ф</span>
          <span>Фишка</span>
        </a>
        <nav class="nav" id="site-nav" aria-label="Основное меню"></nav>
        <div class="header__actions">
          <button
            class="icon-btn theme-toggle"
            type="button"
            aria-label="Тёмная тема"
          ></button>
          <a class="icon-btn" href="#/favorites" aria-label="Избранное">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.6 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.6 0 5.8 3.6 4.5 7.1-1.8 4.8-9.3 9.4-9.3 9.4z"
              />
            </svg>
            <span class="counter-badge" id="fav-count" hidden></span>
          </a>
          <a class="icon-btn" href="#/cart" aria-label="Корзина">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="9" cy="20" r="1.5" />
              <circle cx="18" cy="20" r="1.5" />
              <path
                d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6"
              />
            </svg>
            <span class="counter-badge" id="cart-count" hidden></span>
          </a>
          <button
            class="burger"
            type="button"
            aria-controls="site-nav"
            aria-expanded="false"
            aria-label="Открыть меню"
          >
            <span class="burger__line"></span>
          </button>
        </div>
      </div>
    </header>
    <main class="container">
      <nav class="breadcrumbs" aria-label="Хлебные крошки"></nav>
      <section class="page" id="app" tabindex="-1"></section>
    </main>
    <footer class="footer">
      <div class="container footer__inner">
        <span>© 2026 Фишка — издательство настольных игр</span>
        <span>Создатель сайта — Иутинский Дмитрий</span>
      </div>
    </footer>
  </body>
</html>
